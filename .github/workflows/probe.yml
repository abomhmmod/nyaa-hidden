name: Probe nyaa reachability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe (no notifications, no state changes)
        run: |
          python3 -B - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          sys.argv = ["x"]
          import nyaa_hidden_torrents as nh
          b = nh.DEFAULT_BASE_URL
          nh.warm_up(b, 15, True)
          mx, ids = nh.rss_max_id(b, 15, 2, 1.0, True)
          print("RSS max id:", mx, "ids:", len(ids))
          st, body = nh.http_get(b + "/?p=1", 15, 2, 1.0)
          print("listing p1 status:", st, "ids:", len(nh._RE_VIEW_ID.findall(body)))
          st, body = nh.http_get(b + "/?p=60", 15, 2, 1.0)
          print("listing p60 status:", st, "ids:", len(nh._RE_VIEW_ID.findall(body)))
          ok = 0
          for tid in (2158929, 2181910, 2181909, 2181908):
              st, body = nh.http_get("%s/view/%d" % (b, tid), 15, 2, 1.0)
              real = nh.is_real_page(st, body)
              rec = nh.parse_view(tid, body, b) if real else {}
              ok += st in (200, 404)
              print("view", tid, "status", st, "real", real, "status_tag", rec.get("status"))
          print("RESULT:", "OK" if ok == 4 and mx else "BLOCKED")
          PY
