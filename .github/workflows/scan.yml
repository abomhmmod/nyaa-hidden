name: Scan nyaa hidden torrents
on:
  schedule:
    # احتياط فقط. الفحص الدوريّ يقوم به «الإيقاظ الذاتيّ» (مهمّة wake في آخر هذا الملفّ) كلّ 30 دقيقة.
    # جدولة GitHub هذه تُسقط كثيرًا من مواعيدها، فدورها هنا أن تعيد تشغيل السلسلة إن انقطعت.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Only send a Telegram test message (no scan)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # لا يتداخل فحصان. (القيد على مهمّة الفحص وحدها، حتّى لا يحجز انتظارُ مهمّة wake الفحصَ التالي.)
    concurrency:
      group: nyaa-scan
      cancel-in-progress: false
    steps:
      # آخر نسخة من الفرع لا نسخة لحظة الطلب، حتّى يبدأ الفحص من آخر نقطة حفظها الفحص السابق.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Write config from secrets
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::error::TELEGRAM_TOKEN / TELEGRAM_CHAT_ID secrets are missing — not scanning, so no alert is lost."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          tok = os.environ["TG_TOKEN"].strip()
          try:
              with urllib.request.urlopen("https://api.telegram.org/bot%s/getMe" % tok, timeout=20) as r:
                  print("Telegram bot:", "@" + json.load(r)["result"]["username"])
          except urllib.error.HTTPError as e:
              print("::error::Telegram rejected TELEGRAM_TOKEN (HTTP %d) — fix the secret; not scanning, so no alert is lost." % e.code)
              sys.exit(1)
          json.dump({"discord_webhook": "", "telegram_token": os.environ["TG_TOKEN"],
                     "telegram_chat_id": os.environ["TG_CHAT"]}, open("config.json", "w"))
          PY
      - name: Test notification
        if: ${{ inputs.test_notify }}
        run: python3 -B nyaa_hidden_torrents.py --test-notify | tee /dev/stderr | grep -q "Test message sent"
      - name: Scan
        if: ${{ !inputs.test_notify }}
        env:
          TZ: Asia/Damascus
        run: python3 -B nyaa_hidden_torrents.py --no-open --max-minutes 1
      - name: Save progress
        if: always()
        run: |
          rm -f config.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive.json state.json "التورنتات المخفية.html"
          if ! git diff --cached --quiet; then
            git commit -q -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q
          fi
  wake:
    # الإيقاظ الذاتيّ: بعد انتهاء الفحص ينتظر GitHub مدّة مؤقّت البيئة wake-30 (30 دقيقة؛ تُضبط من
    # Settings ← Environments)، ثمّ يطلب هذا التشغيلُ تشغيلًا جديدًا. والانتظار لا يشغل خادمًا.
    # إن بدأ في الأثناء تشغيل أحدث (من الجدولة أو يدويًّا) فهو الذي يُكمل وهذا يتوقّف، فتبقى سلسلة واحدة.
    # يعمل ولو فشل ما قبله، حتّى لا تنقطع السلسلة. وإيقاف البوت يكون بـ Disable workflow.
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: wake-30
      deployment: false
    permissions:
      actions: write
    steps:
      - name: Request the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          # صمام أمان: لا يُطلب تشغيل جديد قبل مرور هذه الثواني على بدء هذا التشغيل. فلو لم يُطبَّق
          # مؤقّت الانتظار (حُذفت البيئة أو أُلغي مؤقّتها، أو صار المستودع خاصًّا على الخطّة المجّانيّة)
          # لتتابعت التشغيلات بلا توقّف.
          MIN_AGE: 300
        run: |
          warn() {  # $1: سطر في سجلّ التشغيل، $2: تنبيه إلى تيلغرام
            echo "::error::$1"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=⚠️ ${GITHUB_REPOSITORY}: $2") || true
            echo "Telegram warning: HTTP ${code:-none}"
          }
          wf="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"; wf="${wf%@*}"
          api="repos/$GITHUB_REPOSITORY/actions/workflows/$wf"

          started=""
          for i in 1 2 3 4 5 6; do
            started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at 2>/dev/null) && [ -n "$started" ] && break
            sleep 20
          done
          if [ -z "$started" ]; then
            warn "Could not reach the GitHub API to read this run's start time." \
                 "تعذّر الاتّصال بواجهة GitHub، فتوقّف الفحص الدوريّ. لإعادته افتح تبويب Actions في المستودع واضغط Run workflow."
            exit 1
          fi
          age=$(( $(date +%s) - $(date -d "$started" +%s) ))
          if [ "$age" -lt "$MIN_AGE" ]; then
            warn "This run is only ${age}s old, so the wait timer was not applied. Not requesting another run." \
                 "مؤقّت الانتظار لم يُطبَّق، فأوقفتُ الإيقاظ الذاتيّ حتّى لا تتتابع التشغيلات بلا توقّف. راجع المؤقّت في Settings ← Environments، وتأكّد أنّ المستودع عامّ، ثمّ اضغط Run workflow في تبويب Actions."
            exit 1
          fi

          newest=""
          for i in 1 2 3 4 5 6; do
            newest=$(gh api "$api/runs?per_page=1" --jq '.workflow_runs[0] | "\(.id) \(.status)"' 2>/dev/null) && [ -n "$newest" ] && break
            sleep 20
          done
          if [ -n "$newest" ] && [ "${newest%% *}" != "$GITHUB_RUN_ID" ] && [ "${newest#* }" != "completed" ]; then
            echo "A newer run (${newest%% *}) is under way; it will request the next one."
            exit 0
          fi

          err=""
          for i in 1 2 3 4 5 6 7 8; do
            if err=$(gh api -X POST "$api/dispatches" -f ref="$REF" 2>&1); then
              echo "Next run requested."
              exit 0
            fi
            echo "Attempt $i failed: $err"
            case "$err" in
              *"disabled workflow"*) echo "The workflow is disabled, so the chain stops here."; exit 0 ;;
              *"HTTP 403"*|*"HTTP 404"*|*"HTTP 422"*) break ;;
            esac
            sleep 45
          done
          warn "Could not request the next run: $err" \
               "تعذّر طلب التشغيل التالي، فتوقّف الفحص الدوريّ. لإعادته افتح تبويب Actions في المستودع واضغط Run workflow."
          exit 1
